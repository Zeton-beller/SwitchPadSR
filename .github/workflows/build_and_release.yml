name: Build SwitchPadSR APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/SwitchPadSR-v1.0.0-release.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwitchPadSR-APK
          path: release_assets/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "SwitchPad SR v1.0.0 (Release)"
          body: |
            ### 🎮 SwitchPad SR 官方发布版 v1.0.0
            
            专为高通骁龙 8 至尊版（Adreno 830 GPU）与小米平板 8 Pro（3.2K 3:2 屏幕）打造的超低延迟 Switch 采集卡接收与多算法实时超分辨率视频播放器！
            
            #### 🌟 核心特性：
            1. **双输入模式无缝切换**：
               - **Switch 采集卡模式**：原生直连 USB 3.0 / USB 2.0 UVC 采集卡，零拷贝接收 1080p60 YUY2/NV12 原始码流；
               - **普通本地视频播放模式**：硬件解码本地 MP4/MKV/WebM 视频，无缝复用超分管线与参数微调！
            2. **Adreno 830 专有多算法超分辨率引擎**：
               - **高通 SGSR 1.0**：单 Pass 12-Tap 边缘定向锐化，极速 0.22ms 耗时，适合写实 3D 游戏；
               - **Anime4K v4.0**：二次元线稿卷积重构与去阶，绝配《塞尔达传说》、《马力欧》等卡通画风；
               - **AMD FSR 1.0**：EASU + RCAS 动态对比自适应锐化；
               - **复古 CRT 显像管**：经典扫描线、荧光粉栅格与微弧曲面，还原复古掌机街机质感；
               - **双三次插值**：纯净无锐化基准模式。
            3. **3:2 屏幕画幅排版与 Ambilight 动态氛围光**：
               - 等比居中黑边 (Letterbox 1:1) / 动态氛围光 (Ambilight) / 居中裁剪 (Crop) / 强制拉伸；
            4. **全细节参数实时微调控制面板**：
               - 锐化强度、边缘灵敏度、定向抗锯齿开关、去振铃伪影、CRT 扫描线曲率等细节自由调校；
               - 目标分辨率自由设定（3.2K / 2K / 1080p / 自定义倍率）；
               - 画质 A/B 分屏对比拖拽滑块；
            5. **极速高刷与超低输入延迟**：
               - 锁定 144Hz 面板刷新率与 Vulkan Mailbox 交换链，端到端延迟仅 25~35ms！
               - 独占 AAudio 引擎，音频延迟 <8ms。
          draft: false
          prerelease: false
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

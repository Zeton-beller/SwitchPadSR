name: Build SwitchPadSR APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/SwitchPadSR-v1.0.1-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "SwitchPad SR v1.0.1 (Hotfix for Android 17 / HyperOS)"
          body: |
            ### 🎮 SwitchPad SR 官方发布版 v1.0.1 (Android 17 / HyperOS 闪退紧急修复版)

            专为高通骁龙 8 至尊版（Adreno 830 GPU）与小米平板 8 Pro（3.2K 3:2 屏幕，Android 17）深度定制与架构加固。

            #### 🛠️ v1.0.1 关键问题修复 (Bugfixes & Hardening):
            1. **修复 Android 14~17 BroadcastReceiver 致命 SecurityException 闪退**：
               - 将 USB 广播监听重构为 API 34+ 规范：系统事件采用 `RECEIVER_EXPORTED`，权限事件采用 `RECEIVER_NOT_EXPORTED`，并增加双重 fallback try-catch，杜绝首屏闪退。
            2. **彻底解决 16KB Page Size 内存分页兼容性拦截**：
               - 在 CMake 构建链路中强行注入 `-Wl,-z,max-page-size=16384` 标志，确保 native ELF 动态库物理对齐 16KB，彻底解决 Android 15/16/17 对 4KB ELF 的强制 dlopen 拦截。
            3. **修复 SurfaceView 零尺寸导致的 Vulkan 交换链崩溃**：
               - 重构 Surface 生命周期，将 `NativeEngine.nativeInit` 延迟至 `surfaceChanged` 并在获取真实物理宽高后安全初始化；
               - 增加 ANativeWindow 尺寸物理兜底与 Extent Clamping，避免 0x0 尺寸导致的 `VK_ERROR_INITIALIZATION_FAILED`。
            4. **修复 Vulkan 无管线调用 vkCmdDraw 导致的段错误 (SIGSEGV)**：
               - 严密拦截未绑定有效管线时的绘制调用，防止 Adreno 驱动内部空指针异常；
               - 将合成通道 Composite Alpha 由硬编码修正为动态匹配（优先 `VK_COMPOSITE_ALPHA_OPAQUE_BIT_KHR`），完美适配小米平板 8 Pro 窗口合成规范。
            5. **消除 UVC 空转推流异常**：
               - 消除 USB 未连接时的死循环空推流，避免无意义的驱动重试与崩溃。
            6. **加固 Display 与 WindowInsets 异常捕获**：
               - 彻底防护 `onCreate` 阶段 `this.display` 在特定 HyperOS 桌面模式下可能抛出的 `IllegalStateException`。
          draft: false
          prerelease: false
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

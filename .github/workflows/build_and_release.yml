name: Build SwitchPadSR APK and Release

on:
  push:
    branches: [ main, master, feat/fsrcnnx-ai-sr ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate GLSL ES shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools python3 python3-numpy
          bash tests/test_shaders.sh
          python3 tests/test_sr_math.py
          python3 tests/test_fsrcnnx.py
          python3 tests/test_artcnn.py

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" release_assets/SwitchPadSR-v1.4.3-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchPadSR-v1.4.3-release
          path: release_assets/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/fsrcnnx-ai-sr'
        with:
          tag_name: v1.4.3
          name: "SwitchPad SR v1.4.3 (ArtCNN C4F32_DS 架构彻底重构：UBO 常量引擎 + 零寄存器溢出 + 1000倍极速编译)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

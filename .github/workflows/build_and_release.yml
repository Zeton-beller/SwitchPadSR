name: Build SwitchPadSR APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate GLSL ES shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          bash tests/test_shaders.sh

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/SwitchPadSR-v1.1.1-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.1
          name: "SwitchPad SR v1.1.1 (FSR 1.0 & Anime4K 核心算法与参数响应重制)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
